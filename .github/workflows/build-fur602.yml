name: Build HONOR FUR-602/603 (ImmortalWrt mt798x, closed MTK mt_wifi)

# 在线云编译 HONOR FUR-602 / FUR-603（MT7981B, 联通定制 AX3000）固件。
#
# 设计要点
# --------
# * 源码：bbb0bbb0bbb/immortalwrt-mt798x-24.10，分支 2410（ImmortalWrt mt798x，
#   内核 5.4）。该 fork 已自带 honor_fur-602 设备定义 + 设备树 + 闭源 MTK
#   mt_wifi 7.6.6.1 驱动（package/mtk/drivers/mt_wifi，含 mt7981-fw-20240613
#   固件），无需任何注入，自包含可直接编译。
# * 闭源无线驱动：CONFIG_PACKAGE_kmod-mt_wifi=y、CONFIG_MTK_CHIP_MT7981=y、
#   CONFIG_MTK_MT7981_NEW_FW=y。编译前校验会强制检查这几项，确保用的是
#   MTK 闭源 mt_wifi，而不是主线的开源 mt76。
# * .config 已裁剪为"仅 honor_fur-602 单设备"，避免把所有 MT7981 机型都编一遍。
# * 分区布局：IMAGE_SIZE 116736k = expand(114m)，对应 hanwckf 系 uboot 的
#   expand(114m) NAND 布局。KERNEL_IN_UBI=1，产出 factory.bin（UBI 首次刷机）
#   与 sysupgrade.bin（tar，后续升级）。
# * 前置校验：编译 2 小时前先确认设备定义进入 .config、闭源 wifi 已选，失败早退。
# * 后置校验：断言 factory.bin / sysupgrade.bin 真实产出并打印汇总。

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'ImmortalWrt(mt798x) 源码 URL'
        required: true
        default: 'https://github.com/bbb0bbb0bbb/immortalwrt-mt798x-24.10'
      repo_branch:
        description: '源码分支（必须含 honor_fur-602 + 闭源 mt_wifi 的 2410）'
        required: true
        default: '2410'
  push:
    branches: [ main ]
    paths:
      - '.config'
      - '.github/workflows/build-fur602.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REPO_URL: ${{ github.event.inputs.repo_url || 'https://github.com/bbb0bbb0bbb/immortalwrt-mt798x-24.10' }}
  REPO_BRANCH: ${{ github.event.inputs.repo_branch || '2410' }}
  TARGET: mediatek
  SUBTARGET: mt7981
  DEVICE: honor_fur-602

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout build config
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-pip python3-setuptools \
            rsync unzip zlib1g-dev file wget curl subversion patch swig libelf-dev \
            libncursesw5-dev zstd time

      - name: Clone ImmortalWrt (mt798x) source
        run: |
          git clone --depth 1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
          cd openwrt
          echo "IMM_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "IMM_COMMIT_SHORT=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      # 护栏：确认这条分支确实是带 honor_fur-602 的 mt798x 分支。
      - name: Verify source tree assumptions
        working-directory: openwrt
        run: |
          set -eu
          echo "== kernel =="
          grep -E '^(KERNEL_PATCHVER|KERNEL_TESTING_PATCHVER):=' target/linux/mediatek/Makefile || true
          test -f target/linux/mediatek/image/mt7981.mk || {
            echo "::error::mt7981.mk missing; this is not the mt798x 24.10 fork"; exit 1; }
          grep -q 'honor_fur-602' target/linux/mediatek/image/mt7981.mk || {
            echo "::error::honor_fur-602 not defined in mt7981.mk"; exit 1; }
          # 闭源无线驱动源码必须在树上（这才是"闭源 mt_wifi"而不是开源 mt76）
          test -f package/mtk/drivers/mt_wifi/Makefile || {
            echo "::error::closed-source mt_wifi driver not present in tree"; exit 1; }
          echo "source tree OK (honor_fur-602 + closed mt_wifi)"

      - name: Prepare .config (single device)
        working-directory: openwrt
        run: |
          set -eu
          cp -f ../.config .config
          echo "---- selected device / target lines ----"
          grep -E '^CONFIG_TARGET_mediatek(_mt7981)?=|DEVICE_honor_fur-602' .config || true

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate .config
        working-directory: openwrt
        run: make defconfig

      # ---------------------------------------------------------------- #
      # 编译前快检：设备与闭源 wifi 没进配置就直接失败，别等 2 小时。
      # ---------------------------------------------------------------- #
      - name: Pre-build check -- device and closed wifi present
        working-directory: openwrt
        run: |
          set -eu
          DEV_SYM="CONFIG_TARGET_DEVICE_mediatek_mt7981_DEVICE_honor_fur-602"
          if ! grep -q "^${DEV_SYM}=" .config; then
            echo "::error::$DEV_SYM not set"
            echo "---- CONFIG_TARGET_* lines (diagnostic) ----"
            grep '^CONFIG_TARGET' .config || true
            exit 1
          fi
          echo "device honor_fur-602 selected: OK ($DEV_SYM)"
          # 闭源 mt_wifi 驱动必须是 =y（装进固件），而不是主线 mt76
          if ! grep -q '^CONFIG_PACKAGE_kmod-mt_wifi=y' .config; then
            echo "::error::kmod-mt_wifi (closed MTK driver) not selected =y"
            exit 1
          fi
          if ! grep -q '^CONFIG_MTK_CHIP_MT7981=y' .config; then
            echo "::error::MTK_CHIP_MT7981 not set"
            exit 1
          fi
          echo "closed mt_wifi driver: OK"
          echo "pre-build check passed"

      - name: Download packages
        working-directory: openwrt
        run: make download -j8

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j$(nproc) V=s || make -j1 V=s

      # ---------------------------------------------------------------- #
      # 后置校验：断言真正产出了 factory.bin 与 sysupgrade.bin。
      # ---------------------------------------------------------------- #
      - name: Verify images
        working-directory: openwrt
        run: |
          set -eu
          BIN="bin/targets/$TARGET/$SUBTARGET"
          test -d "$BIN" || { echo "::error::$BIN missing"; exit 1; }
          echo "===== firmware images ====="
          ls -la "$BIN"/*.bin 2>/dev/null || true

          FACTORY=$(ls "$BIN"/*"$DEVICE"*factory*.bin 2>/dev/null | head -1 || true)
          SYSUP=$(ls "$BIN"/*"$DEVICE"*sysupgrade*.bin 2>/dev/null | head -1 || true)
          [ -n "$FACTORY" ] || { echo "::error::factory.bin not produced for $DEVICE"; exit 1; }
          [ -n "$SYSUP" ]   || { echo "::error::sysupgrade.bin not produced for $DEVICE"; exit 1; }
          echo "factory.bin    = $FACTORY ($(stat -c%s "$FACTORY") bytes)"
          echo "sysupgrade.bin = $SYSUP ($(stat -c%s "$SYSUP") bytes)"
          echo "===== profiles / manifest ====="
          grep -q 'honor,fur-602' "$BIN/profiles.json" \
            || echo "::warning::honor,fur-602 not found in profiles.json"
          ls "$BIN"/*.manifest 2>/dev/null || echo "(no manifest)"
          echo "verify OK"

      - name: Build summary
        if: always()
        working-directory: openwrt
        run: |
          {
            echo "## HONOR FUR-602/603 build summary"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| source | $REPO_URL |"
            echo "| branch | $REPO_BRANCH |"
            echo "| commit | ${IMM_COMMIT:-unknown} |"
            echo "| kernel | 5.4 (mt798x) |"
            echo "| wifi driver | MTK closed-source mt_wifi 7.6.6.1 (kmod-mt_wifi) |"
            echo "| target | $TARGET / $SUBTARGET |"
            echo "| device | $DEVICE |"
            echo "| layout | expand(114m), IMAGE_SIZE 116736k |"
            echo "| images | factory.bin (UBI, 首次刷机) + sysupgrade.bin (tar, 升级) |"
            echo ""
            echo "### firmware images"
            echo '```'
            ls -la "bin/targets/$TARGET/$SUBTARGET"/*.bin 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"

      - name: Collect artifacts
        run: |
          mkdir -p out
          BIN="openwrt/bin/targets/$TARGET/$SUBTARGET"
          find "$BIN" -maxdepth 1 -type f \
            \( -name '*.bin' -o -name '*.itb' -o -name '*.ubi' -o -name '*.tar' \
               -o -name '*.manifest' -o -name 'profiles.json' -o -name 'sha256sums' -o -name 'sha256sums.txt' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/ || true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: honor-fur602-firmware-${{ env.IMM_COMMIT_SHORT }}
          path: out/
          retention-days: 14
          if-no-files-found: error
