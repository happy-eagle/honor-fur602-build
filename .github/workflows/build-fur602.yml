name: Build FUR-602 (mt7981 mtwifi + SSR-Plus)

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-21.02

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib libssl-dev \
            libncurses5-dev libncursesw5-dev zlib1g-dev gawk subversion \
            git gettext unzip file rsync python3 python3-pip python3-setuptools \
            swig libpython3-dev time xxd wget curl cpio patch \
            automake autoconf libtool libgmp-dev libmpc-dev libmpfr-dev \
            bison flex texinfo xz-utils qemu-utils genisoimage \
            dosfstools mtools upx-ucl libjson-c-dev libudev-dev

      - name: Update & install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom defconfig
        run: |
          cp -f defconfig/mt7981-fur602-ssr.config .config
          make defconfig

      - name: Download source packages
        run: make download -j$(nproc) V=s || make download -j1 V=s

      - name: Build firmware
        shell: bash
        run: |
          make -j$(nproc) V=s > build.log 2>&1 || (echo "===== build failed, tail of log ====="; tail -n 200 build.log; exit 1)

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fur602-firmware
          path: |
            bin/targets/mediatek/mt7981/*.bin
            bin/targets/mediatek/mt7981/*.tar.gz
            bin/targets/mediatek/mt7981/sha256sums
            build.log
          if-no-files-found: error
